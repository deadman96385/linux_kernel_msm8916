%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/siliconmitus,sm5703-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Silicon Mitus SM5703 Battery Charger

maintainers:
  - Sean Hoyt <seanhoyt963@gmail.com>

description:
  The charger is a child of the SM5703 multi-function device. Cable type is
  supplied by an SM5502-compatible MUIC through the extcon subsystem.

properties:
  compatible:
    const: siliconmitus,sm5703-charger

  monitored-battery: true

  siliconmitus,monitored-fuel-gauge:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Fuel gauge supplying the live battery temperature used to inhibit
      charging outside the monitored battery's temperature limits.

  siliconmitus,usb-connector:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the USB connector child of the SM5703 MUIC node.

  enable-gpios:
    maxItems: 1
    description:
      Active-low nCHGEN hardware charger-enable input.

  input-current-limit-microamp:
    minimum: 100000
    maximum: 2100000
    multipleOf: 50000
    default: 1000000
    description:
      Maximum input current used for a dedicated charging port. SDP and CDP
      limits are selected from the USB-defined limits.

  input-voltage-limit-microvolt:
    minimum: 4300000
    maximum: 4900000
    multipleOf: 100000
    default: 4300000
    description:
      Automatic input-current-limit voltage threshold.

  siliconmitus,topoff-timer-minutes:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Top-off safety timer duration.
    enum: [10, 20, 30, 45]
    default: 45

  siliconmitus,boost-iq3-limit-1x:
    type: boolean
    description:
      Select the full boost-converter IQ3 current limit instead of 0.7 times
      the nominal limit.

  siliconmitus,poll-interval-ms:
    minimum: 1000
    maximum: 60000
    default: 10000
    description:
      Interval between battery-temperature safety checks.

required:
  - compatible
  - monitored-battery
  - siliconmitus,monitored-fuel-gauge
  - siliconmitus,usb-connector

allOf:
  - $ref: power-supply.yaml#

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    charger {
        compatible = "siliconmitus,sm5703-charger";
        monitored-battery = <&battery>;
        siliconmitus,monitored-fuel-gauge = <&fuel_gauge>;
        siliconmitus,usb-connector = <&usb_con>;
        enable-gpios = <&tlmm 119 GPIO_ACTIVE_LOW>;
        input-current-limit-microamp = <1000000>;
        input-voltage-limit-microvolt = <4300000>;
        siliconmitus,topoff-timer-minutes = <45>;
        siliconmitus,boost-iq3-limit-1x;
    };
...
