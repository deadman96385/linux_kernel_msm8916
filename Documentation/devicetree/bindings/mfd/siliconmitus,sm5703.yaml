%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/siliconmitus,sm5703.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Silicon Mitus SM5703 Multi-Function Device

maintainers:
  - Sean Hoyt <seanhoyt963@gmail.com>

description: |
  The SM5703 is a companion power-management IC containing a battery charger,
  an OTG boost converter, regulators and a flash LED controller. Its MUIC and
  fuel gauge are independent I2C devices and are described separately.

properties:
  compatible:
    const: siliconmitus,sm5703

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description:
      Active-low master reset input.

  wakeup-source: true

  regulators:
    $ref: /schemas/regulator/siliconmitus,sm5703-regulator.yaml#

  charger:
    $ref: /schemas/power/supply/siliconmitus,sm5703-charger.yaml#
    unevaluatedProperties: false

required:
  - compatible
  - reg
  - interrupts

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@49 {
            compatible = "siliconmitus,sm5703";
            reg = <0x49>;
            interrupt-parent = <&tlmm>;
            interrupts = <1 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&tlmm 36 GPIO_ACTIVE_LOW>;

            regulators {
                vbus {
                    regulator-name = "usb_vbus";
                    regulator-min-microvolt = <5000000>;
                    regulator-max-microvolt = <5000000>;
                };
            };
        };
    };
...
