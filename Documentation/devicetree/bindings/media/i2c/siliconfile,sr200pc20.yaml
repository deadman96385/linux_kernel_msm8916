%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/siliconfile,sr200pc20.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SiliconFile SR200PC20 image sensor

maintainers:
  - Sean Hoyt <seanhoyt963@gmail.com>

description:
  The SiliconFile SR200PC20 is a 2-megapixel CMOS image sensor with an
  integrated image signal processor. It is controlled over I2C and transmits
  YUV 4:2:2 image data over a single-lane MIPI CSI-2 interface.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: siliconfile,sr200pc20

  reg:
    const: 0x20

  clocks:
    maxItems: 1

  clock-names:
    const: xclk

  reset-gpios:
    maxItems: 1

  standby-gpios:
    maxItems: 1

  vana-supply:
    description: Analog supply

  vdig-supply:
    description: Digital core supply

  vio-supply:
    description: Digital I/O supply

  orientation: true

  rotation: true

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            maxItems: 1

          link-frequencies:
            description:
              The normal preview frequency is required. The recording-mode
              frequency is optional for modules that support that tuning.
            minItems: 1
            maxItems: 2
            items:
              - const: 144000000
              - const: 180000000

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - reset-gpios
  - standby-gpios
  - vana-supply
  - vdig-supply
  - vio-supply
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@20 {
            compatible = "siliconfile,sr200pc20";
            reg = <0x20>;

            clocks = <&camera_clk>;
            clock-names = "xclk";

            reset-gpios = <&gpio 28 GPIO_ACTIVE_HIGH>;
            standby-gpios = <&gpio 32 GPIO_ACTIVE_HIGH>;

            vana-supply = <&camera_vana>;
            vdig-supply = <&camera_vdig>;
            vio-supply = <&camera_vio>;

            port {
                endpoint {
                    data-lanes = <1>;
                    link-frequencies = /bits/ 64 <144000000 180000000>;
                    remote-endpoint = <&csi_in>;
                };
            };
        };
    };
...
