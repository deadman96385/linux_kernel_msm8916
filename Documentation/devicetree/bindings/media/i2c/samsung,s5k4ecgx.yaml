%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k4ecgx.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K4ECGX image sensor

maintainers:
  - Sean Hoyt <seanhoyt963@gmail.com>

description:
  The Samsung S5K4ECGX is a 5-megapixel CMOS image sensor with an integrated
  image signal processor and autofocus engine. It is controlled over I2C and
  transmits processed YUV 4:2:2 data over a two-lane MIPI CSI-2 interface.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5k4ecgx

  reg:
    const: 0x56

  clocks:
    maxItems: 1

  clock-names:
    const: xclk

  reset-gpios:
    maxItems: 1

  standby-gpios:
    maxItems: 1

  vana-supply:
    description: Analog supply

  vdig-supply:
    description: Digital core supply

  vio-supply:
    description: Digital I/O supply

  vaf-supply:
    description: Autofocus supply

  orientation: true

  rotation: true

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            minItems: 2
            maxItems: 2

          link-frequencies:
            maxItems: 1

        required:
          - data-lanes
          - link-frequencies

    required:
      - endpoint

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - reset-gpios
  - standby-gpios
  - vana-supply
  - vdig-supply
  - vio-supply
  - vaf-supply
  - port

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@56 {
            compatible = "samsung,s5k4ecgx";
            reg = <0x56>;

            clocks = <&camera_clk>;
            clock-names = "xclk";

            reset-gpios = <&gpio 35 GPIO_ACTIVE_HIGH>;
            standby-gpios = <&gpio 34 GPIO_ACTIVE_HIGH>;

            vana-supply = <&camera_vana>;
            vdig-supply = <&camera_vdig>;
            vio-supply = <&camera_vio>;
            vaf-supply = <&camera_vaf>;

            port {
                endpoint {
                    data-lanes = <1 2>;
                    link-frequencies = /bits/ 64 <144000000>;
                    remote-endpoint = <&csi_in>;
                };
            };
        };
    };
...
